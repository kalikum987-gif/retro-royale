<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Royale</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1017; color: #fff; }

.screen {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
width: 100%; height: 100%;
background-size: cover;
background-position: center;
z-index: 10;
}

#s1 {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 14px;
background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.68)), url('./splash_bg.png.jpg');
}

#s2 {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 14px;
background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.68)), url('./login_bg.png.jpg');
}

#s3 {
display: none;
background-image: linear-gradient(rgba(0,0,0,0.22), rgba(0,0,0,0.48)), url('./lobby_bg.png.jpg');
}

.btn-main {
padding: 14px 28px;
font-size: 16px;
font-weight: bold;
border: none;
border-radius: 8px;
cursor: pointer;
background: #ffb300;
color: #111;
position: relative;
z-index: 50;
}
.btn-blue { background: #1e88e5; color: #fff; }

/* Lobby HUD */
.top-hud {
position: absolute; top: 14px; left: 14px; right: 14px;
display: flex; justify-content: space-between; align-items: center;
z-index: 30;
}
.hud-pill {
background: rgba(12, 16, 26, 0.82);
border: 1px solid rgba(255, 255, 255, 0.18);
padding: 8px 14px; border-radius: 8px;
display: flex; align-items: center; gap: 10px;
}
.char-badge-title { font-weight: bold; color: #ffd54f; font-size: 15px; }
.char-badge-skill { font-size: 12px; color: #cfd8dc; }

.left-dock {
position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
display: flex; flex-direction: column; gap: 10px; z-index: 30;
}
.ff-side-btn {
width: 96px; padding: 10px 8px;
background: rgba(15, 20, 32, 0.88);
border: 1.5px solid #ffb300;
border-radius: 10px; color: #fff; cursor: pointer;
display: flex; flex-direction: column; align-items: center; gap: 4px;
font-weight: bold; font-size: 12px;
}

.char-drawer {
position: absolute; left: 124px; top: 76px; bottom: 96px;
width: 250px; max-width: calc(100vw - 140px);
background: rgba(12, 16, 26, 0.94);
border: 1px solid rgba(255, 179, 0, 0.5);
border-radius: 12px; padding: 12px;
display: none; flex-direction: column; gap: 10px;
z-index: 35; overflow-y: auto;
}
.drawer-header {
display: flex; justify-content: space-between; align-items: center;
border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 8px;
font-weight: bold; color: #ffd54f; font-size: 14px;
}
.close-btn {
background: rgba(255,255,255,0.15); color: #fff; border: none;
border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
}
.char-card {
display: flex; align-items: center; gap: 10px;
padding: 8px; border-radius: 8px; cursor: pointer;
background: rgba(255,255,255,0.07);
border: 1px solid transparent; text-align: left; width: 100%; color: #fff;
}
.char-card.active {
background: rgba(255, 179, 0, 0.22);
border-color: #ffb300;
}
.char-avatar {
width: 44px; height: 44px; border-radius: 8px;
background: #263238;
display: flex; align-items: center; justify-content: center;
font-weight: bold; font-size: 15px; color: #ffd54f; flex-shrink: 0;
overflow: hidden;
}
.char-avatar img { width: 100%; height: 100%; object-fit: cover; }
.char-meta { display: flex; flex-direction: column; gap: 2px; }
.char-name { font-weight: bold; font-size: 14px; }
.char-skill-sub { font-size: 11px; color: #b0bec5; }

.stage-3d {
position: absolute; top: 0; left: 0; right: 0; bottom: 0;
width: 100%; height: 100%;
z-index: 15;
}
model-viewer {
width: 100%; height: 100%;
background: transparent; --poster-color: transparent;
}
.model-status {
position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
background: rgba(0,0,0,0.75); color: #ffd54f; padding: 6px 12px;
border-radius: 8px; font-size: 13px; pointer-events: none; z-index: 25;
}

.bottom-right-dock {
position: absolute; right: 20px; bottom: 20px;
z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.ff-start-btn {
padding: 14px 36px; font-size: 20px; font-weight: 900; letter-spacing: 1px;
border: none; border-radius: 8px; cursor: pointer;
background: linear-gradient(90deg, #ff9800, #ffc107);
color: #111;
}
.start-note {
font-size: 12px; color: #eceff1;
background: rgba(0,0,0,0.68); padding: 4px 10px; border-radius: 6px;
}
</style>
</head>
<body>

<!-- Screen 1 -->
<div id="s1" class="screen">
<h1>RETRO ROYALE</h1>
<p>Splash Screen (v2)</p>
<button type="button" class="btn-main btn-blue" onclick="goStep(2)">ENTER GAME</button>
</div>

<!-- Screen 2 -->
<div id="s2" class="screen">
<h1>LOGIN SCREEN</h1>
<p>Tap to enter Retro Royale Lobby</p>
<button type="button" class="btn-main" onclick="goStep(3)">TAP TO START</button>
</div>

<!-- Screen 3 -->
<div id="s3" class="screen">
<div class="top-hud">
<div class="hud-pill">
<div>
<div id="hudCharName" class="char-badge-title">ADAM</div>
<div id="hudCharSkill" class="char-badge-skill">Skill: No Skill</div>
</div>
</div>
<div class="hud-pill">
<button type="button" class="close-btn" onclick="toggleMute()">🔊 Audio</button>
</div>
</div>

<div class="left-dock">
<button type="button" class="ff-side-btn" onclick="toggleDrawer()">
<span>👤</span>
<span>CHARACTER</span>
</button>
</div>

<div id="charDrawer" class="char-drawer">
<div class="drawer-header">
<span>CHARACTERS</span>
<button type="button" class="close-btn" onclick="toggleDrawer()">✕</button>
</div>
<div id="charList"></div>
</div>

<div id="stage3d" class="stage-3d">
<div id="modelStatus" class="model-status">3D Character लोड हो रहा है...</div>
</div>

<div class="bottom-right-dock">
<div id="startHint" class="start-note">Ready: ADAM</div>
<button type="button" class="ff-start-btn" onclick="onStartClick()">START</button>
</div>
</div>

<script>
var CHARACTERS = [
{ id: 'adam', name: 'ADAM', skill: 'No Skill', file: './Adam_Lobby.glb', icon: '' },
{ id: 'alok', name: 'ALOK', skill: 'Drop the Beat', file: './alok_lobby.glb', icon: './alok_skill_icon.png' },
{ id: 'andrew', name: 'ANDREW', skill: 'Vest Mastery', file: './andrew_lobby.glb', icon: '' },
{ id: 'maxim', name: 'MAXIM', skill: 'Gluttony', file: './maxim_lobby.glb', icon: '' },
{ id: 'eve', name: 'EVE', skill: 'No Skill', file: './eve_lobby.glb', icon: '' }
 ];

var isMuted = false;
var selectedIdx = 0;
var bgmAudio = null;
var viewerCreated = false;

function playSound(src, loop) {
if (isMuted || !src) return;
try {
var a = new Audio(src);
a.loop = !!loop;
var p = a.play();
if (p && p.catch) p.catch(function () {});
return a;
} catch (e) {}
}

function goStep(step) {
document.getElementById('s1').style.display = 'none';
document.getElementById('s2').style.display = 'none';
document.getElementById('s3').style.display = 'none';

if (step === 1) {
document.getElementById('s1').style.display = 'flex';
} else if (step === 2) {
playSound('./splashClip.mp3', false);
document.getElementById('s2').style.display = 'flex';
} else if (step === 3) {
playSound('./ClickClip.mp3', false);
document.getElementById('s3').style.display = 'block';
initLobby();
}
}

function initLobby() {
renderCharacterCards();
if (!viewerCreated) {
viewerCreated = true;
var s = document.createElement('script');
s.type = 'module';
s.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';
document.head.appendChild(s);

var mv = document.createElement('model-viewer');
mv.id = 'mv';
mv.setAttribute('alt', 'Lobby Character');
mv.setAttribute('auto-rotate', '');
mv.setAttribute('camera-controls', '');
mv.setAttribute('camera-orbit', '0deg 78deg auto');
mv.setAttribute('field-of-view', '34deg');
mv.setAttribute('exposure', '1.4');
mv.setAttribute('shadow-intensity', '1');

var statusEl = document.getElementById('modelStatus');
mv.addEventListener('load', function () {
statusEl.style.display = 'none';
});
mv.addEventListener('error', function () {
statusEl.style.display = 'block';
statusEl.innerText = '3D मॉडल लोड नहीं हो पाया: ' + mv.getAttribute('src');
});

document.getElementById('stage3d').appendChild(mv);
}
selectCharacter(selectedIdx, true);
if (!isMuted && !bgmAudio) {
bgmAudio = playSound('./lobby_bgm.mp3', true);
}
}

function renderCharacterCards() {
var listEl = document.getElementById('charList');
listEl.innerHTML = '';
for (var i = 0; i < CHARACTERS.length; i++) {
(function (idx) {
var c = CHARACTERS[idx];
var btn = document.createElement('button');
btn.type = 'button';
btn.className = 'char-card' + (idx === selectedIdx ? ' active' : '');
btn.onclick = function () { selectCharacter(idx, false); };

var avatarHtml = c.icon
? '<img src="' + c.icon + '" alt="' + c.name + '" onerror="this.parentNode.innerText='' + c.name.charAt(0) + ''" />'
: c.name.charAt(0);

btn.innerHTML =
'<div class="char-avatar">' + avatarHtml + '</div>' +
'<div class="char-meta">' +
'<div class="char-name">' + c.name + '</div>' +
'<div class="char-skill-sub">' + c.skill + '</div>' +
'</div>';
listEl.appendChild(btn);
})(i);
}
}

function selectCharacter(idx, silent) {
selectedIdx = idx;
var c = CHARACTERS[selectedIdx];
if (!silent) playSound('./ClickClip.mp3', false);

document.getElementById('hudCharName').innerText = c.name;
document.getElementById('hudCharSkill').innerText = 'Skill: ' + c.skill;
document.getElementById('startHint').innerText = 'Ready: ' + c.name;

var mvEl = document.getElementById('mv');
var statusEl = document.getElementById('modelStatus');
if (statusEl) {
statusEl.style.display = 'block';
statusEl.innerText = c.name + ' लोड हो रहा है...';
}
if (mvEl) {
mvEl.setAttribute('src', c.file);
}
renderCharacterCards();
}

function toggleDrawer() {
playSound('./ClickClip.mp3', false);
var d = document.getElementById('charDrawer');
d.style.display = (d.style.display === 'flex') ? 'none' : 'flex';
}

function toggleMute() {
isMuted = !isMuted;
if (isMuted && bgmAudio) {
try { bgmAudio.pause(); } catch (e) {}
bgmAudio = null;
} else if (!isMuted && document.getElementById('s3').style.display === 'block') {
bgmAudio = playSound('./lobby_bgm.mp3', true);
}
}

function onStartClick() {
playSound('./ClickClip.mp3', false);
var c = CHARACTERS[selectedIdx];
document.getElementById('startHint').innerText = c.name + ' Selected — Next Module Ready';
}
</script>
</body>
</html>
