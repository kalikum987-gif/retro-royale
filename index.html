<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Royale</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body, html { width: 100%; height: 100%; background: #11131a; color: #fff; }
.box {
width: 100%; height: 100%;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
text-align: center; padding: 20px; gap: 14px;
}
.hidden { display: none; }
button {
padding: 12px 24px; font-size: 16px; font-weight: bold;
border: none; border-radius: 8px; cursor: pointer;
background: #ffb300; color: #111;
}
</style>
</head>
<body>

<div id="s1" class="box">
<h1>RETRO ROYALE</h1>
<p>Step 1: Splash</p>
<button id="b1" type="button" onclick="window.nextStep(2)">ENTER GAME</button>
</div>

<div id="s2" class="box hidden">
<h1>LOGIN SCREEN</h1>
<p>Step 2: Login</p>
<button id="b2" type="button" onclick="window.nextStep(3)">TAP TO START</button>
</div>

<div id="s3" class="box hidden">
<h1>LOBBY SCREEN</h1>
<p id="charText">Current Character: ADAM</p>
<button id="b3" type="button" onclick="window.toggleChar()">SWITCH CHARACTER (ADAM / ALOK)</button>
</div>

<script>
window.nextStep = function (step) {
document.getElementById('s1').classList.add('hidden');
document.getElementById('s2').classList.add('hidden');
document.getElementById('s3').classList.add('hidden');
document.getElementById('s' + step).classList.remove('hidden');
};

var isAlok = false;
window.toggleChar = function () {
isAlok = !isAlok;
document.getElementById('charText').innerText =
'Current Character: ' + (isAlok ? 'ALOK (Drop the Beat)' : 'ADAM (No Skill)');
};
</script>
</body>
</html>ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
