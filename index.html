

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Royale - Module 1 Prototype</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; color: #fff; }
.screen {
position: absolute; inset: 0;
display: none; flex-direction: column;
align-items: center; justify-content: center;
background-size: cover; background-position: center;
text-align: center; padding: 20px;
}
.active { display: flex; }
#splash-screen {
background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), url('./splash_bg.png.jpg');
}
#login-screen {
background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), url('./login_bg.png.jpg');
}
#lobby-screen {
background: radial-gradient(circle at center, #1a2a4a 0%, #070b14 100%);
justify-content: space-between;
}
.title { font-size: 2.5rem; font-weight: 800; letter-spacing: 2px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
.sub { margin-top: 8px; font-size: 1rem; opacity: 0.9; }
.btn {
margin-top: 16px; padding: 12px 28px; font-size: 1rem; font-weight: 700;
border: none; border-radius: 8px; cursor: pointer;
}
.btn-primary { background: #1e88e5; color: #fff; }
.btn-gold { background: #ffb300; color: #111; }
.btn-google { background: #ffffff; color: #202124; }
.auth-status { margin-top: 12px; font-size: 0.95rem; color: #ffd54f; font-weight: 600; }
model-viewer { width: 100%; height: 62vh; background: transparent; }
.top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(0,0,0,0.45); border-radius: 8px; }
.bottom-bar { width: 100%; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding-bottom: 10px; }
.lobby-img-badge {
display: inline-flex; align-items: center; gap: 8px;
padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,0.55); margin-bottom: 6px;
}
.lobby-img-badge img { height: 28px; width: auto; object-fit: contain; }
</style>
</head>
<body>

<!-- 1. SPLASH SCREEN -->
<div id="splash-screen" class="screen active">
<div class="title">RETRO ROYALE</div>
<div class="sub">लोड हो रहा है... (या नीचे बटन दबाएं)</div>
<button class="btn btn-primary" onclick="goToLogin()">ENTER GAME</button>
</div>

<!-- 2. LOGIN SCREEN -->
<div id="login-screen" class="screen">
<div class="title">RETRO ROYALE</div>
<div class="sub">सर्वर कनेक्टेड • अपना अकाउंट चुनें</div>
<button class="btn btn-google" onclick="selectGoogleAccount()">Continue with Google</button>
<div id="account-status" class="auth-status">अकाउंट: Guest / Ready</div>
<button class="btn btn-gold" onclick="enterLobby()">TAP TO START</button>
</div>

<!-- 3. LOBBY SCREEN -->
<div id="lobby-screen" class="screen">
<div class="top-bar">
<div id="player-tag">PRAVEEN (LV. 1) • ADAM</div>
<div>Retro Royale Lobby</div>
</div>

<model-viewer
id="lobby-character"
src="./Adam_Lobby.glb"
alt="Adam Lobby 3D Character"
auto-rotate
camera-controls
shadow-intensity="1">
</model-viewer>

<div class="bottom-bar">
<div class="lobby-img-badge">
<img src="./lobby_buttons.png.jpg" alt="Lobby UI" onerror="this.style.display='none'" />
<span>Lobby UI</span>
</div>
<button class="btn btn-primary" onclick="playClick()">CHARACTER (ADAM)</button>
<button class="btn btn-primary" onclick="playClick()">VAULT</button>
<button class="btn btn-gold" onclick="playClick()">START MATCH</button>
</div>
</div>

<!-- AUDIO ASSETS -->
<audio id="splashClip" src="./splashClip.mp3.mp3" preload="auto"></audio>
<audio id="clickClip" src="./ClickClip.mp3.mp3" preload="auto"></audio>
<audio id="lobbyBgm" src="./lobby_bgm.mp3.mp3" loop preload="auto"></audio>

<script>
const splashScreen = document.getElementById('splash-screen');
const loginScreen = document.getElementById('login-screen');
const lobbyScreen = document.getElementById('lobby-screen');

const splashClip = document.getElementById('splashClip');
const clickClip = document.getElementById('clickClip');
const lobbyBgm = document.getElementById('lobbyBgm');

let selectedAccount = "PRAVEEN (LV. 1)";

function playSound(audioEl) {
if (!audioEl) return;
audioEl.currentTime = 0;
audioEl.play().catch(() => {});
}

function goToLogin() {
playSound(splashClip);
splashScreen.classList.remove('active');
loginScreen.classList.add('active');
}

function selectGoogleAccount() {
playSound(clickClip);
selectedAccount = "PRAVEEN (GOOGLE ACCOUNT • LV. 1)";
document.getElementById('account-status').innerText = "अकाउंट कनेक्टेड: " + selectedAccount;
}

function enterLobby() {
playSound(clickClip);
loginScreen.classList.remove('active');
lobbyScreen.classList.add('active');
document.getElementById('player-tag').innerText = selectedAccount + " • ADAM";
lobbyBgm.play().catch(() => {});
}

function playClick() {
playSound(clickClip);
}
</script>
</body>
</html>
