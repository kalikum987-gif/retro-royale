<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Royale</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1017; color: #fff; }

.screen {
position: fixed; inset: 0; width: 100%; height: 100%;
background-size: cover; background-position: center;
}
#s1 {
display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.68)), url('./splash_bg.png.jpg');
}
#s2 {
display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.68)), url('./login_bg.png.jpg');
}
#s3 {
display: none;
background-image: linear-gradient(rgba(0,0,0,0.22), rgba(0,0,0,0.45)), url('./lobby_bg.png.jpg');
}

.btn {
padding: 12px 24px; font-size: 16px; font-weight: bold;
border: none; border-radius: 8px; cursor: pointer;
}
.btn-blue { background: #1e88e5; color: #fff; }
.btn-gold { background: #ffb300; color: #111; }

/* Top Corners */
.hud-top {
position: absolute; top: 14px; left: 14px; right: 14px;
display: flex; justify-content: space-between; align-items: center; z-index: 20;
}
.box-dark {
background: rgba(12, 16, 26, 0.82);
border: 1px solid rgba(255, 255, 255, 0.16);
border-radius: 8px; padding: 8px 14px;
}
.title-gold { font-weight: bold; color: #ffd54f; font-size: 15px; }
.sub-text { font-size: 12px; color: #cfd8dc; }

/* Left Side CHARACTER Button */
.left-btn {
position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
z-index: 20; width: 100px; padding: 10px 8px;
background: rgba(15, 20, 32, 0.88); border: 1.5px solid #ffb300;
border-radius: 10px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer;
}

/* Character Side Panel */
.panel {
position: absolute; left: 126px; top: 76px; bottom: 96px;
width: 245px; max-width: calc(100vw - 142px);
background: rgba(12, 16, 26, 0.94); border: 1px solid rgba(255, 179, 0, 0.5);
border-radius: 12px; padding: 12px; display: none; flex-direction: column; gap: 8px;
z-index: 25; overflow-y: auto;
}
.panel-head {
display: flex; justify-content: space-between; align-items: center;
padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.12);
color: #ffd54f; font-weight: bold; font-size: 14px;
}
.small-btn {
background: rgba(255,255,255,0.15); color: #fff; border: none;
border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px;
}
.char-item {
width: 100%; padding: 8px 10px; border-radius: 8px; cursor: pointer;
background: rgba(255,255,255,0.07); border: 1px solid transparent;
color: #fff; text-align: left; display: flex; flex-direction: column; gap: 2px;
}
.char-item.active { background: rgba(255, 179, 0, 0.22); border-color: #ffb300; }

/* 3D Stage */
.stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; }
model-viewer { width: 100%; height: 100%; background: transparent; --poster-color: transparent; }
.status {
position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
background: rgba(0,0,0,0.78); color: #ffd54f; padding: 6px 12px;
border-radius: 8px; font-size: 13px; z-index: 15; text-align: center;
}

/* Bottom-Right START Button */
.right-bottom {
position: absolute; right: 20px; bottom: 20px; z-index: 20;
display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.start-btn {
padding: 14px 34px; font-size: 20px; font-weight: 900;
border: none; border-radius: 8px; cursor: pointer;
background: linear-gradient(90deg, #ff9800, #ffc107); color: #111;
}
</style>
</head>
<body>

<!-- 1. Splash -->
<div id="s1" class="screen">
<h1>RETRO ROYALE</h1>
<button type="button" class="btn btn-blue" onclick="goStep(2, './splashClip.mp3')">ENTER GAME</button>
</div>

<!-- 2. Login -->
<div id="s2" class="screen">
<h1>LOGIN</h1>
<button type="button" class="btn btn-gold" onclick="goStep(3, './ClickClip.mp3')">TAP TO START</button>
</div>

<!-- 3. Lobby -->
<div id="s3" class="screen">
<div class="hud-top">
<div class="box-dark">
<div id="hudName" class="title-gold">ADAM</div>
<div id="hudSkill" class="sub-text">Skill: No Skill</div>
</div>
<div class="box-dark">
<button id="muteBtn" type="button" class="small-btn" onclick="toggleMute()">🔊 Audio</button>
</div>
</div>

<button type="button" class="left-btn" onclick="togglePanel()">👤 CHARACTER</button>

<div id="panel" class="panel">
<div class="panel-head">
<span>CHARACTERS</span>
<button type="button" class="small-btn" onclick="togglePanel()">✕</button>
</div>
<div id="charList"></div>
</div>

<div class="stage">
<div id="status" class="status">3D मॉडल लोड हो रहा है...</div>
<model-viewer
id="mv"
src="./Adam_Lobby.glb"
alt="Lobby Character"
auto-rotate
camera-controls
camera-orbit="0deg 78deg auto"
field-of-view="34deg"
exposure="1.4"
shadow-intensity="1">
</model-viewer>
</div>

<div class="right-bottom">
<div id="readyNote" class="box-dark sub-text">Ready: ADAM</div>
<button type="button" class="start-btn" onclick="onStart()">START</button>
</div>
</div>

<script>
var CHARS = [
{ name: 'ADAM', skill: 'No Skill', file: './Adam_Lobby.glb' },
{ name: 'ALOK', skill: 'Drop the Beat', file: './alok_lobby.glb' },
{ name: 'ANDREW', skill: 'Vest Mastery', file: './andrew_lobby.glb' },
{ name: 'MAXIM', skill: 'Gluttony', file: './maxim_lobby.glb' },
{ name: 'EVE', skill: 'No Skill', file: './eve_lobby.glb' }
 ];

var current = 0;
var muted = false;
var bgm = null;
var mv = document.getElementById('mv');
var statusEl = document.getElementById('status');

function playClip(src, loop) {
if (muted || !src) return;
try {
var a = new Audio(src);
a.loop = !!loop;
var p = a.play();
if (p && p.catch) p.catch(function () {});
return a;
} catch (e) {}
}

function goStep(step, soundSrc) {
if (soundSrc) playClip(soundSrc, false);
document.getElementById('s1').style.display = (step === 1) ? 'flex' : 'none';
document.getElementById('s2').style.display = (step === 2) ? 'flex' : 'none';
document.getElementById('s3').style.display = (step === 3) ? 'block' : 'none';

if (step === 3) {
renderList();
pickChar(current, true);
if (!muted && !bgm) bgm = playClip('./lobby_bgm.mp3', true);
}
}

function renderList() {
var wrap = document.getElementById('charList');
wrap.innerHTML = '';
for (var i = 0; i < CHARS.length; i++) {
(function (idx) {
var c = CHARS[idx];
var b = document.createElement('button');
b.type = 'button';
b.className = 'char-item' + (idx === current ? ' active' : '');
b.innerHTML = '<b>' + c.name + '</b><span class="sub-text">' + c.skill + '</span>';
b.onclick = function () { pickChar(idx, false); };
wrap.appendChild(b);
})(i);
}
}

function pickChar(idx, silent) {
current = idx;
var c = CHARS[current];
if (!silent) playClip('./ClickClip.mp3', false);

document.getElementById('hudName').innerText = c.name;
document.getElementById('hudSkill').innerText = 'Skill: ' + c.skill;
document.getElementById('readyNote').innerText = 'Ready: ' + c.name;

statusEl.style.display = 'block';
statusEl.innerText = c.name + ' लोड हो रहा है...';
mv.setAttribute('src', c.file);
renderList();
}

function togglePanel() {
playClip('./ClickClip.mp3', false);
var p = document.getElementById('panel');
p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
}

function toggleMute() {
muted = !muted;
document.getElementById('muteBtn').innerText = muted ? '🔇 Muted' : '🔊 Audio';
if (muted && bgm) {
try { bgm.pause(); } catch (e) {}
bgm = null;
} else if (!muted && document.getElementById('s3').style.display === 'block' && !bgm) {
bgm = playClip('./lobby_bgm.mp3', true);
}
}

function onStart() {
playClip('./ClickClip.mp3', false);
document.getElementById('readyNote').innerText = CHARS[current].name + ' Selected';
}

mv.addEventListener('load', function () {
statusEl.style.display = 'none';
});

mv.addEventListener('error', function () {
statusEl.style.display = 'block';
statusEl.innerText = 'लोड नहीं हो पाया: ' + mv.getAttribute('src');
});
</script>
</body>
</html>
